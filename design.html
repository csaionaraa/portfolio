<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design — Carla Saionara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Karla:wght@400;500;600;700;800&family=Press+Start+2P&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="design-page">
  <div class="site-loader" aria-hidden="true">
    <span>Carla Saionara</span>
  </div>

  <header class="navbar" id="navbar">
    <nav class="nav-container">
      <ul class="nav-links" id="nav-links">
        <li><a class="nav-link" href="index.html#inicio" data-pt="Início">
          <span class="roll"><span class="roll-inner"><span>Home</span><span aria-hidden="true">Home</span></span></span>
        </a></li>
        <li><a class="nav-link" href="index.html#sobre" data-pt="Sobre">
          <span class="roll"><span class="roll-inner"><span>About</span><span aria-hidden="true">About</span></span></span>
        </a></li>
        <li><a class="nav-link" href="index.html#projetos" data-pt="Projetos">
          <span class="roll"><span class="roll-inner"><span>Projects</span><span aria-hidden="true">Projects</span></span></span>
        </a></li>
        <li><a class="nav-link" href="index.html#contato" data-pt="Contato">
          <span class="roll"><span class="roll-inner"><span>Contact</span><span aria-hidden="true">Contact</span></span></span>
        </a></li>
      </ul>

      <button class="lang-toggle" id="lang-toggle" aria-label="Trocar idioma / Change language">
        <span data-idioma="en">EN</span>
        <span aria-hidden="true">/</span>
        <span data-idioma="pt">PT</span>
      </button>

      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <main>
    <section class="design-gallery-heading" aria-labelledby="design-gallery-title">
      <p data-pt="PORTFÓLIO">PORTFOLIO</p>
      <h1 id="design-gallery-title">Design</h1>
    </section>

    <section class="design-gallery design-gallery--page" aria-label="Galeria de projetos de design">
      <button class="design-artwork" type="button" aria-label="Ampliar arte de divulgação para Bingos Especiais" data-full-image="imagens/design/BINGOSESPECIAIS-864x1080.webp" data-image-alt="Arte de divulgação para Bingos Especiais">
        <img src="imagens/design/BINGOSESPECIAIS-864x1080.webp" alt="Arte de divulgação para Bingos Especiais" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar peça de design gráfico, camada 74" data-full-image="imagens/design/Camada-74.webp" data-image-alt="Peça de design gráfico, camada 74">
        <img src="imagens/design/Camada-74.webp" alt="Peça de design gráfico, camada 74" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar peça de design gráfico, camada 78" data-full-image="imagens/design/Camada-78.webp" data-image-alt="Peça de design gráfico, camada 78">
        <img src="imagens/design/Camada-78.webp" alt="Peça de design gráfico, camada 78" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar arte gráfica Carcara" data-full-image="imagens/design/CARCARA.png" data-image-alt="Arte gráfica Carcara">
        <img src="imagens/design/CARCARA.png" alt="Arte gráfica Carcara" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar arte promocional de conteúdo gratuito" data-full-image="imagens/design/gratuito.webp" data-image-alt="Arte promocional de conteúdo gratuito">
        <img src="imagens/design/gratuito.webp" alt="Arte promocional de conteúdo gratuito" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar arte promocional para grupo da Copa" data-full-image="imagens/design/grupo-copa.webp" data-image-alt="Arte promocional para grupo da Copa">
        <img src="imagens/design/grupo-copa.webp" alt="Arte promocional para grupo da Copa" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar arte promocional para grupo VIP" data-full-image="imagens/design/GRUPOVIP (1).webp" data-image-alt="Arte promocional para grupo VIP">
        <img src="imagens/design/GRUPOVIP (1).webp" alt="Arte promocional para grupo VIP" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar arte gráfica para grupo VIP" data-full-image="imagens/design/grupovip.webp" data-image-alt="Arte gráfica para grupo VIP">
        <img src="imagens/design/grupovip.webp" alt="Arte gráfica para grupo VIP" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar arte promocional VIP" data-full-image="imagens/design/vipvip.webp" data-image-alt="Arte promocional VIP">
        <img src="imagens/design/vipvip.webp" alt="Arte promocional VIP" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar pôster inspirado na marca Zara" data-full-image="imagens/design/ZARA POSTER.png" data-image-alt="Pôster inspirado na marca Zara">
        <img src="imagens/design/ZARA POSTER.png" alt="Pôster inspirado na marca Zara" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar arte de campanha Papitona para a Copa do Mundo" data-full-image="imagens/design/Camada_16.png" data-image-alt="Arte de campanha Papitona para a Copa do Mundo">
        <img src="imagens/design/Camada_16.png" alt="Arte de campanha Papitona para a Copa do Mundo" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar cartaz Papitona de presente" data-full-image="imagens/design/NETO_PRESENTE.png" data-image-alt="Cartaz Papitona de presente">
        <img src="imagens/design/NETO_PRESENTE.png" alt="Cartaz Papitona de presente" loading="lazy" decoding="async" />
      </button>
      <button class="design-artwork" type="button" aria-label="Ampliar guia visual para ensaio fotográfico" data-full-image="imagens/design/ensaio.png" data-image-alt="Guia visual para ensaio fotográfico">
        <img src="imagens/design/ensaio.png" alt="Guia visual para ensaio fotográfico" loading="lazy" decoding="async" />
      </button>
    </section>
  </main>

  <dialog class="artwork-modal" id="artwork-modal" aria-label="Imagem ampliada">
    <button class="artwork-modal-close" type="button" aria-label="Fechar imagem ampliada">&times;</button>
    <img class="artwork-modal-image" alt="" />
  </dialog>

  <script src="https://unpkg.com/lenis@1.3.1/dist/lenis.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
