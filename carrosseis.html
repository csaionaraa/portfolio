    <!--
      Para adicionar um carrossel: copie um bloco <article class="carousel-series"> inteiro,
      troque o título e aponte as imagens para a nova pasta, na ordem dos slides.
      As fotos ficam em imagens/carrosseis/<nome-da-pasta>/1.jpg, 2.jpg, 3.jpg...
    -->
    <section class="carousel-list" aria-label="Galeria de carrosséis">

      <article class="carousel-series">
        <header class="carousel-series-header">
          <h2 data-pt="Educação">Education</h2>
          <span class="carousel-series-count" data-pt="6 slides">6 slides</span>
        </header>
        <div class="carousel-strip">
          <button class="design-artwork carousel-slide" type="button" aria-label="Ampliar slide 1 do carrossel de Educação" data-full-image="imagens/carrosseis/educacao/1.jpg" data-image-alt="Carrossel de Educação, slide 1">
            <img src="imagens/carrosseis/educacao/1.jpg" alt="Carrossel de Educação, slide 1" loading="lazy" decoding="async" />
          </button>
          <button class="design-artwork carousel-slide" type="button" aria-label="Ampliar slide 2 do carrossel de Educação" data-full-image="imagens/carrosseis/educacao/2.jpg" data-image-alt="Carrossel de Educação, slide 2">
